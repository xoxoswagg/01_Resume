<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML FORM</title>
</head>
<body>
<div>
<label for="application number">application number:</label>
<input type="text" name="application number" id="application number" placeholder="your answer">
</div>
<div>
<label for="university reg no">university reg no:</label>
<input type="text" name="university reg no" id="university reg no" placeholder="your answer">
</div>
<div>
<label for="Candidate Name">Candidate Name:</label>
<input type="text" name="Candidate Name" id="Candidate Name" placeholder="your answer">
</div>
<div>
<label for="email" required>Email:</label>
<input type="email" name="Email" id="email" placeholder="your answer">
</div>
<label for="contact no">Contact no:</label>
<input type="number" name="Contact no" id="contact no" placeholder="your answer">
<br>
<fieldset>
<legend>Course Completed:</legend>
<label for="Course">YES</label>
<input type="radio" name="Course" id="Course">
<label for="Course">NO</label>
<input type="radio" name="Course" id="Course">
</fieldset>
<br>
<label for="HomeTown And City">HomeTown And City:</label>
<input type="text" name="HomeTown And City" id="HomeTown And City" placeholder="your answer">
<br>
<legend>College Name:
<label for="College Name">Peri College Of Arts And Science</label>
<input type="radio" name="College Name" id="College Name" placeholder="your answer">
</legend>
<label for="year of passing">year of passing:</label>
<input type="number" name="year of passing" id="year of passing" placeholder="your answer">
<br>
<label for="Resume">Upload Your Resume:</label>
<input type="file" name="Resume" id="Resume" accept=".pdf,.dox,.word,.jpg">
<br>
<fieldset>
<legend>Comfortable to Relocation to Bangalore:
    </legend>
<label for="Relocation">YES</label>
<input type="radio" name="Relocation" id="Relocation">
<label for="Relocation">NO</label>
<input type="radio" name="Relocation" id="Relocation">
</fieldset>
<br>
<fieldset>
<legend>Immidiate Joining:
    </legend>
<label for="Joining">YES</label>
<input type="radio" name="Joining" id="Joining">
<label for="Joining">NO</label>
<input type="radio" name="Joining" id="Joining">
</fieldset>
<br>
<button>submit</button>
</form>
</body>
</html>
